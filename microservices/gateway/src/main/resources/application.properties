spring.application.name=gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=user
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/user/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1


spring.cloud.gateway.server.webmvc.routes[1].id=order
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ORDER
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/order/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1